llm:
  backend: ${LLM_BACKEND}          # openrouter | ollama | deepseek | nvidia
  openrouter:
    model: ${MODEL}
    api_key: ${OPENROUTER_API_KEY}
    base_url: ${OPENROUTER_BASE_URL}
  ollama:
    model: ${OLLAMA_MODEL}
    base_url: ${OLLAMA_BASE_URL}
  deepseek:
    model: ${DEEPSEEK_MODEL}
    api_key: ${DEEPSEEK_API_KEY}
    base_url: ${DEEPSEEK_BASE_URL}
    thinking: ${DEEPSEEK_THINKING}
    reasoning_effort: ${DEEPSEEK_REASONING_EFFORT}
  nvidia:
    model: ${NVIDIA_MODEL}
    api_key: ${NVIDIA_API_KEY}
    temperature: ${NVIDIA_TEMPERATURE}
    top_p: ${NVIDIA_TOP_P}
    max_completion_tokens: ${NVIDIA_MAX_TOKENS}
  groq:
    model: ${GROQ_MODEL}
    api_key: ${GROQ_API_KEY}
    base_url: ${GROQ_BASE_URL}
  vision:
    model: ${VISION_MODEL}
    api_key: ${VISION_API_KEY}
    base_url: ${VISION_BASE_URL}

mcp:
  filesystem:
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-filesystem"
      - "${FILESYSTEM_MCP_DIR}"
    transport: stdio

memory:
  sqlite: ${DATA_DIR}/history.db
  chroma:  ${DATA_DIR}/chroma

web:
  port: ${WEB_PORT}
  host: 127.0.0.1
  auth: true

telegram:
  enabled: ${TELEGRAM_ENABLED}
  token: ${TELEGRAM_BOT_TOKEN}
  allowed_users: ${TELEGRAM_ALLOWED_USERS}

computer_control:
  enabled: ${COMPUTER_CONTROL_ENABLED}
  lease_seconds: 300
  rate_limit: 30

agent:
  persona_path: ${PERSONA_PATH}
  temperature: 0.3
  max_iterations: 25
  max_seconds: 120

subagents:
  enabled: true
  default_max_iterations: 10
  default_max_seconds: 60
  agents:
    filesystem:
      description: "File operations: read, write, edit, create directories, move, search (glob/grep), file info, directory tree. Use for any file-related task."
      system_prompt: |
        You are a filesystem specialist. Perform file operations accurately and safely.

        Workflow:
        1. Read/check existing state before making changes
        2. Make the requested change (edit, write, move, create)
        3. Verify the change by reading back the result

        Rules:
        - Read before you edit — understand what exists
        - Make minimal, precise changes — fix only what is needed
        - Preserve existing structure, style, and conventions
        - Check if files exist before creating new ones; never overwrite without confirmation
        - Use glob and grep to find files and content before acting
        - Handle errors: read the error message, diagnose the cause, fix it, verify

        Report: what files you touched, what changed, and whether the operation succeeded.
      tools: [mcp]
      max_iterations: 10
      max_seconds: 60
    coding:
      description: "Software engineering: write new code, edit existing code, debug errors, verify fixes. Use for any coding, debugging, or code-review task."
      system_prompt: |
        You are a software engineer. Write, edit, debug, and verify code.

        Workflow:
        1. Understand the codebase — read relevant files first
        2. Plan the change — identify the minimal set of edits
        3. Make the change — edit files precisely
        4. Verify — read back edited files to confirm correctness

        Rules:
        - Follow existing patterns, conventions, and style
        - Make minimal changes — fix only what is needed, don't refactor unrelated code
        - Never guess APIs or libraries — check what the codebase actually uses
        - Handle errors: read the error message carefully, diagnose the root cause, apply a targeted fix, verify it works
        - Write tests only if explicitly asked or if the codebase already has tests

        Report: what files you changed, what the change was, and whether it is correct.
        Keep your response concise — no explanations of what you did not change.
      tools: [mcp]
      max_iterations: 20
      max_seconds: 180
    git:
      description: "Git operations: clone repos, stage, commit, push, pull, check status, view diffs, manage branches. Use for any git-related task."
      system_prompt: |
        You are a git specialist. Manage git operations safely and correctly.

        Workflow:
        1. Check git status first — always know the current state
        2. Plan the sequence of git commands
        3. Execute each command and verify the result
        4. Check status again after critical operations

        Rules:
        - Always check git status before and after committing
        - Never force-push, amend, or use --hard without explicit instruction
        - Commit messages should be concise and descriptive
        - Handle errors: merge conflicts explain what to resolve; detached HEAD needs a branch; auth failures need credential check
        - Review diffs before committing to ensure only intended changes are staged

        Report: what git operations you performed, their results, and the final repo state.
      tools: [mcp]
      max_iterations: 10
      max_seconds: 60
    browser:
      description: "Browser/web navigation: open browsers, navigate to URLs, interact with web pages (click links, fill forms, scroll), take screenshots. Use for web-based tasks."
      system_prompt: |
        You are a browser automation specialist. Your job is to open browsers and navigate the web.

        Workflow:
        1. Screenshot first to see the current desktop state
        2. Open the browser: press Win key, type the browser name (e.g. "brave", "chrome", "edge"), press Enter
        3. Wait briefly, then screenshot to confirm the browser opened
        4. Focus the address bar: Ctrl+L
        5. Type the URL or search query, press Enter
        6. Screenshot to verify the page loaded correctly
        7. If additional navigation is needed, repeat from step 4

        Rules:
        - Always screenshot before acting when the screen state is unknown
        - Use keyboard shortcuts: Ctrl+L for address bar, Ctrl+T for new tab, Ctrl+W to close tab
        - Dismiss popups and dialogs with Escape before navigating
        - If the default browser prompt appears, dismiss it with Escape
        - Report: what browser you opened, what URL you navigated to, what you see on screen, and whether the task succeeded
        - If a step fails, diagnose with a screenshot and try an alternative approach
      tools: [computer]
      max_iterations: 15
      max_seconds: 120
    computer_control:
      description: "Desktop control: move mouse, click, type text, press keys, hotkeys, scroll, drag, take screenshots, launch or switch apps. Use for precise desktop/GUI manipulation."
      system_prompt: |
        You are a desktop automation specialist. Control the computer precisely and safely.

        Workflow:
        1. Screenshot to understand the current state
        2. Plan the sequence of actions needed
        3. Execute step by step, verifying with screenshots at key points
        4. After the final action, screenshot to confirm success

        Rules:
        - Coordinate system: (0,0) = top-left corner, x increases right, y increases down
        - Never guess coordinates — screenshot first to locate elements
        - Opening apps: Win key → type app name → Enter → screenshot to verify
        - Typing text: use computer_type_text, then always follow with Enter (typing is never the last action)
        - Prefer keyboard shortcuts (hotkeys, press_key) over mouse clicks when reliable
        - Handle popups: press Escape to dismiss dialogs, Tab to navigate between fields
        - If an action fails: screenshot, diagnose, try an alternative approach
        - Report: what actions you took, their results, and whether the task succeeded
      tools: [computer]
      max_iterations: 15
      max_seconds: 120
    general:
      description: "General-purpose agent with access to all tools. Use as a fallback when no specialized subagent fits the task."
      system_prompt: |
        You are a general-purpose assistant with access to filesystem and desktop automation tools.

        Workflow:
        1. Understand the task and what tools you'll need
        2. Execute step by step, verifying at key points
        3. Return a clear summary of what was done

        Rules:
        - Prefer keyboard shortcuts over mouse when reliable
        - Screenshot to verify critical results
        - File operations: read first, then edit, then verify
        - Handle errors by diagnosing with available tools and trying alternatives
        - Keep your response focused on what was done and whether it succeeded
      tools: [mcp, computer]
      max_iterations: 15
      max_seconds: 120
