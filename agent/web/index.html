<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal AI Agent</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #1a1a2e; color: #e0e0e0; display: flex; flex-direction: column; }
  header { flex-shrink: 0; background: #16213e; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #0f3460; }
  header h1 { font-size: 18px; font-weight: 600; }
  #status { font-size: 12px; color: #8a8a9a; }
  #status .ok { color: #4ecca3; }
  #messages { flex: 1; min-height: 0; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
  #messages::-webkit-scrollbar { width: 8px; }
  #messages::-webkit-scrollbar-track { background: #1a1a2e; }
  #messages::-webkit-scrollbar-thumb { background: #4ecca3; border-radius: 4px; }
  #messages::-webkit-scrollbar-thumb:hover { background: #6edfc3; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; font-size: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: #0f3460; color: #e0e0e0; }
  .msg.assistant { align-self: flex-start; background: #2a2a4e; color: #e0e0e0; }
  .msg.error { align-self: center; background: #4a1a1a; color: #ff8a8a; font-size: 13px; }
  .msg.thinking { align-self: flex-start; color: #8a8a9a; font-style: italic; font-size: 13px; }
  .trace { align-self: stretch; background: #121b31; border: 1px solid #274060; border-radius: 10px; display: flex; flex-direction: column; max-height: 320px; }
  .trace-header { flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; background: #17243f; color: #9fc4ff; font-size: 13px; font-weight: 600; }
  .trace-events { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 8px; }
  .trace-events::-webkit-scrollbar { width: 6px; }
  .trace-events::-webkit-scrollbar-track { background: #121b31; }
  .trace-events::-webkit-scrollbar-thumb { background: #274060; border-radius: 3px; }
  .tool-panel { align-self: stretch; background: #0f2217; border: 1px solid #1f4a30; border-radius: 10px; display: flex; flex-direction: column; max-height: 300px; }
  .tool-panel-header { flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; background: #142a1c; color: #6edfc3; font-size: 13px; font-weight: 600; }
  .tool-cards { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 8px; }
  .tool-cards::-webkit-scrollbar { width: 6px; }
  .tool-cards::-webkit-scrollbar-track { background: #0f2217; }
  .tool-cards::-webkit-scrollbar-thumb { background: #1f4a30; border-radius: 3px; }
  .tool-card { background: #132619; border: 1px solid #1f4a30; border-radius: 7px; padding: 8px 10px; font-size: 12px; }
  .tool-card.running { opacity: 0.7; }
  .tool-card.failed { border-color: #8b4040; background: #1f1515; }
  .tool-card-name { color: #6edfc3; font-weight: 600; margin-bottom: 4px; display: flex; justify-content: space-between; }
  .tool-card-name .dur { color: #6a8f7a; font-weight: 400; }
  .tool-card-args { color: #8a9a9a; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; margin-bottom: 4px; white-space: pre-wrap; word-break: break-word; max-height: 60px; overflow-y: auto; }
  .tool-card-args::-webkit-scrollbar { width: 4px; }
  .tool-card-args::-webkit-scrollbar-thumb { background: #2a5530; border-radius: 2px; }
  .tool-card-output { color: #c7d3c8; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre-wrap; word-break: break-word; max-height: 120px; overflow-y: auto; margin-top: 4px; padding: 6px 8px; background: #0a1a0f; border-radius: 4px; border-left: 2px solid #2a6a3a; }
  .tool-card-output::-webkit-scrollbar { width: 4px; }
  .tool-card-output::-webkit-scrollbar-thumb { background: #2a5530; border-radius: 2px; }
  .tool-card .err { color: #ff9f9f; }
  .trace-event { background: #18233a; border: 1px solid #263a5e; border-radius: 7px; }
  .trace-event summary { cursor: pointer; padding: 8px 10px; color: #d6e5ff; font-size: 12px; list-style: none; }
  .trace-event summary::-webkit-details-marker { display: none; }
  .trace-event summary::before { content: '›'; display: inline-block; margin-right: 7px; color: #4ecca3; transition: transform .15s ease; }
  .trace-event[open] summary::before { transform: rotate(90deg); }
  .trace-event pre { margin: 0; padding: 0 10px 10px 25px; max-height: 360px; overflow: auto; color: #c7d3e8; font: 12px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
  .trace-event.failed { border-color: #8b4040; }
  .trace-event.failed summary { color: #ff9f9f; }
  #input-bar { flex-shrink: 0; background: #16213e; padding: 12px 20px; border-top: 1px solid #0f3460; display: flex; gap: 10px; }
  #input { flex: 1; background: #1a1a2e; border: 1px solid #0f3460; color: #e0e0e0; padding: 10px 14px; border-radius: 8px; font-size: 14px; outline: none; }
  #input:focus { border-color: #4ecca3; }
  #send { background: #0f3460; color: #4ecca3; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }
  #send:hover { background: #1a4a8a; }
  #send:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <h1>Personal AI Agent</h1>
  <div id="status">connecting...</div>
</header>
<div id="messages"></div>
<div id="input-bar">
  <input id="input" type="text" placeholder="Message your agent..." autocomplete="off" />
  <button id="send">Send</button>
</div>
<script>
const wsUrl = `ws://${location.host}/chat`;
const msgs = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const status = document.getElementById('status');
let ws;
let busy = false;
let activeTrace = null;
let activeToolPanel = null;
let pendingToolCard = null;
let reconnectAttempts = 0;
let reconnectTimer = null;
let reconnectCountdownId = null;
let pendingMessages = [];
let maxReconnectAttempts = 10;

function setBusy(b) { busy = b; sendBtn.disabled = b; input.disabled = b; if (!b) input.focus(); }

function clearTrace() { activeTrace = null; activeToolPanel = null; pendingToolCard = null; }

function startCountdown(delay) {
  if (reconnectCountdownId) clearInterval(reconnectCountdownId);
  let remaining = Math.ceil(delay / 1000);
  status.textContent = `● reconnecting in ${remaining}s...`;
  reconnectCountdownId = setInterval(function () {
    remaining -= 1;
    if (remaining <= 0) {
      clearInterval(reconnectCountdownId);
      reconnectCountdownId = null;
      status.textContent = '● connecting...';
    } else {
      status.textContent = `● reconnecting in ${remaining}s...`;
    }
  }, 1000);
}

function flushPending() {
  while (pendingMessages.length > 0 && ws && ws.readyState === WebSocket.OPEN) {
    const msg = pendingMessages.shift();
    ws.send(JSON.stringify(msg));
  }
}

function addMsg(type, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + type;
  d.textContent = text;
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
  return d;
}

function scrollToBottom() {
  msgs.scrollTop = msgs.scrollHeight;
}

function formatMoney(value) {
  const n = Number(value);
  return Number.isFinite(n) ? n.toFixed(4) : null;
}

function updateStatus(data) {
  const parts = ['<span class="ok">online</span>'];
  if (data && Number.isFinite(Number(data.tools))) {
    parts.push(`${Number(data.tools)} tools`);
  }
  const spent = formatMoney(data && data.spent_today);
  const cap = data && Number.isFinite(Number(data.daily_cap)) ? Number(data.daily_cap) : null;
  if (spent !== null && cap !== null) {
    parts.push(`$${spent}/${cap}`);
  }
  status.innerHTML = parts.join(' | ');
}

function ensureTracePanel() {
  if (activeTrace) return activeTrace;
  const panel = document.createElement('section');
  panel.className = 'trace';
  const header = document.createElement('div');
  header.className = 'trace-header';
  const title = document.createElement('span');
  title.textContent = 'Observability';
  const summary = document.createElement('span');
  summary.textContent = 'waiting for agent';
  header.append(title, summary);
  const events = document.createElement('div');
  events.className = 'trace-events';
  panel.append(header, events);
  msgs.appendChild(panel);
  activeTrace = { panel, summary, events, count: 0 };
  scrollToBottom();
  return activeTrace;
}

function ensureToolPanel() {
  if (activeToolPanel) return activeToolPanel;
  const panel = document.createElement('section');
  panel.className = 'tool-panel';
  const header = document.createElement('div');
  header.className = 'tool-panel-header';
  const title = document.createElement('span');
  title.textContent = 'Tool Calls';
  const summary = document.createElement('span');
  summary.textContent = '0 calls';
  header.append(title, summary);
  const cards = document.createElement('div');
  cards.className = 'tool-cards';
  panel.append(header, cards);
  msgs.appendChild(panel);
  activeToolPanel = { panel, summary, cards, count: 0 };
  scrollToBottom();
  return activeToolPanel;
}

function addToolEvent(event) {
  const panel = ensureToolPanel();

  if (event.type === 'tool_started') {
    panel.count += 1;
    panel.summary.textContent = `${panel.count} call${panel.count > 1 ? 's' : ''}`;
    const card = document.createElement('div');
    card.className = 'tool-card running';
    card.dataset.toolIdx = panel.count;
    const head = document.createElement('div');
    head.className = 'tool-card-name';
    head.innerHTML = `<span>&#9654; ${event.tool_name}</span><span class="dur">running...</span>`;
    card.appendChild(head);
    if (event.arguments && Object.keys(event.arguments).length > 0) {
      const args = document.createElement('div');
      args.className = 'tool-card-args';
      args.textContent = JSON.stringify(event.arguments);
      card.appendChild(args);
    }
    panel.cards.appendChild(card);
    pendingToolCard = card;
    panel.cards.scrollTop = panel.cards.scrollHeight;
    scrollToBottom();

  } else if (event.type === 'tool_completed') {
    const card = pendingToolCard || panel.cards.lastElementChild;
    if (card) {
      card.classList.remove('running');
      const dur = card.querySelector('.dur');
      if (dur) dur.textContent = `${event.duration_ms || '?'} ms`;
      if (event.output) {
        const out = document.createElement('div');
        out.className = 'tool-card-output';
        out.textContent = event.output;
        card.appendChild(out);
      }
      if (event.is_error) {
        card.classList.add('failed');
        const head = card.querySelector('.tool-card-name span:first-child');
        if (head) head.textContent = head.textContent.replace('▶', '✖');
      }
      panel.cards.scrollTop = panel.cards.scrollHeight;
      scrollToBottom();
      pendingToolCard = null;
    }

  } else if (event.type === 'tool_failed') {
    const card = pendingToolCard || panel.cards.lastElementChild;
    if (card) {
      card.classList.remove('running');
      card.classList.add('failed');
      const dur = card.querySelector('.dur');
      if (dur) dur.textContent = `${event.duration_ms || '?'} ms`;
      const head = card.querySelector('.tool-card-name span:first-child');
      if (head) head.textContent = head.textContent.replace('▶', '✖');
      const err = document.createElement('div');
      err.className = 'tool-card-output err';
      err.textContent = `${event.error_type}: ${event.error}`;
      card.appendChild(err);
      panel.cards.scrollTop = panel.cards.scrollHeight;
      scrollToBottom();
      pendingToolCard = null;
    }
  }
}

function traceTitle(event) {
  const duration = event.duration_ms === undefined ? '' : ` \u00b7 ${event.duration_ms} ms`;
  switch (event.type) {
    case 'turn_started': return 'Turn started';
    case 'turn_completed': return `Turn completed${duration}`;
    case 'turn_blocked': return `Turn blocked: ${event.reason || 'unknown reason'}`;
    case 'turn_failed': return `Turn failed: ${event.error_type || 'unknown error'}${duration}`;
    case 'memory_recall_started': return 'Memory recall started';
    case 'memory_recall_completed': return `Memory recall: ${event.matches || 0} matches${duration}`;
    case 'memory_history_loaded': return `Chat history: ${event.messages || 0} messages${duration}`;
    case 'memory_persisted': return `Memory persisted${duration}`;
    case 'llm_started': return `LLM request #${event.llm_call} \u00b7 ${event.model || 'model'}`;
    case 'llm_completed': return `LLM output #${event.llm_call}${duration}`;
    case 'llm_failed': return `LLM failed: ${event.error_type || 'unknown error'}${duration}`;
    case 'tool_started': return `Tool command: ${event.tool_name}`;
    case 'tool_completed': return `Tool output: ${event.tool_name}${event.is_error ? ' (reported error)' : ''}${duration}`;
    case 'tool_failed': return `Tool failed: ${event.tool_name} \u00b7 ${event.error_type || 'unknown error'}${duration}`;
    default: return event.type;
  }
}

function tracePayload(event) {
  const ignored = new Set(['type', 'sequence', 'timestamp', 'turn_id', 'duration_ms']);
  const payload = {};
  Object.entries(event).forEach(([key, value]) => {
    if (!ignored.has(key)) payload[key] = value;
  });
  return JSON.stringify(payload, null, 2) || '{}';
}

function addTraceEvent(event) {
  const trace = ensureTracePanel();
  trace.count += 1;
  trace.summary.textContent = `${trace.count} events \u00b7 ${event.turn_id.slice(0, 8)}`;

  const item = document.createElement('details');
  item.className = 'trace-event';
  item.open = true;
  if (event.type.endsWith('failed') || event.is_error) item.classList.add('failed');
  const title = document.createElement('summary');
  title.textContent = traceTitle(event);
  const payload = document.createElement('pre');
  payload.textContent = tracePayload(event);
  item.append(title, payload);
  trace.events.appendChild(item);
  trace.events.scrollTop = trace.events.scrollHeight;
  scrollToBottom();
}

function handleMessage(e) {
  const data = JSON.parse(e.data);

  if (data.type === 'history') {
    msgs.innerHTML = '';
    data.messages.forEach(m => addMsg(m.role === 'user' ? 'user' : 'assistant', m.content));
    scrollToBottom();
  } else if (data.type === 'remote_user') {
    addMsg('user', data.text);
    if (data.source) {
      const el = msgs.lastElementChild;
      if (el) el.textContent += ' \u00b7 via ' + data.source;
    }
    const trace = ensureTracePanel();
    msgs.appendChild(trace.panel);
    if (activeToolPanel) msgs.appendChild(activeToolPanel.panel);
    setBusy(true);
  } else if (data.type === 'thinking') {
    addMsg('thinking', 'agent thinking...');
    ensureTracePanel();
  } else if (data.type === 'trace') {
    addTraceEvent(data.event);
    if (data.event.type.startsWith('tool_')) {
      addToolEvent(data.event);
    }
  } else if (data.type === 'answer') {
    msgs.querySelectorAll('.msg.thinking').forEach(t => t.remove());
    addMsg('assistant', data.text);
    updateStatus(data);
    setBusy(false);
  } else if (data.type === 'error') {
    msgs.querySelectorAll('.msg.thinking').forEach(t => t.remove());
    addMsg('error', data.text);
    setBusy(false);
  }
}

function connect() {
  if (ws && ws.readyState === WebSocket.OPEN) return;
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  if (reconnectCountdownId) { clearInterval(reconnectCountdownId); reconnectCountdownId = null; }
  if (reconnectAttempts >= maxReconnectAttempts) {
    status.textContent = '● Connection lost. Refresh to reconnect.';
    setBusy(true);
    return;
  }
  ws = new WebSocket(wsUrl);
  ws.onopen = function () {
    updateStatus({});
    reconnectAttempts = 0;
    flushPending();
    fetch('/health').then(function (r) { return r.json(); }).then(function (d) {
      updateStatus(d);
    }).catch(function () {});
    setBusy(false);
  };
  ws.onclose = function () {
    clearTrace();
    msgs.querySelectorAll('.msg.thinking').forEach(function (t) { t.remove(); });
    setBusy(false);
    if (reconnectAttempts >= maxReconnectAttempts) {
      status.textContent = '● Connection lost. Refresh to reconnect.';
      return;
    }
    var delay = Math.min(5000 * Math.pow(2, reconnectAttempts), 30000);
    delay += Math.floor(Math.random() * 1000);
    reconnectAttempts += 1;
    startCountdown(delay);
    reconnectTimer = setTimeout(connect, delay);
  };
  ws.onerror = function () { status.textContent = '● error'; };
  ws.onmessage = handleMessage;
}

function send() {
  var text = input.value.trim();
  if (!text) return;
  activeTrace = null;
  activeToolPanel = null;
  pendingToolCard = null;
  addMsg('user', text);
  input.value = '';
  setBusy(true);
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    pendingMessages.push({ text: text, session_id: 'default' });
    addMsg('error', 'Message queued — reconnecting...');
    return;
  }
  ws.send(JSON.stringify({ text: text, session_id: 'default' }));
}

sendBtn.onclick = send;
input.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };
connect();
</script>
</body>
</html>
